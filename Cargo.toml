[package]
name = "contreforts-core"
version.workspace = true
edition.workspace = true
# contreforts-declaration (contreforts/contreforts-core#14) is nested here
# provisionally but is a wholly separate crate -- see its own README.md.
# Exclude it so it is never mistaken for part of this crate's own manifest.
exclude = ["declaration"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
reqwest = { version = "0.12", default-features = false, optional = true }
urlencoding = { workspace = true }

[features]
reqwest = ["dep:reqwest"]

[dev-dependencies]
tokio = { workspace = true }