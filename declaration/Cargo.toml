[package]
name = "contreforts-declaration"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Deepthought Solutions"]
# Nested provisionally inside contreforts-core -- see README.md and the
# crate-level doc comment in src/lib.rs. contreforts/contreforts-core#14.

[dependencies]
# Exact pin, not "0.2": contreforts/contreforts-workspace#21 selected
# shacl-rust as the only candidate that both compiles and treats
# oxigraph::model as its native type system, while recording real maturity
# risk -- 607 downloads, single author, 0.2.0 -> 0.2.9 in five days. An
# exact pin is the cheap insurance against an untested transitive bump.
shacl-rust = "=0.2.9"
# Matches the outer workspace's pin (see the root Cargo.toml). Deliberately
# NOT `{ workspace = true }`: this crate must depend on nothing about the
# superproject it happens to be nested in right now (see lib.rs), so its
# manifest has to stand on its own even outside that workspace.
oxigraph = "0.5"
thiserror = "2"
# Added by the connector_validation module's move from contreforts-kg
# (contreforts/contreforts-workspace#58, comment 7791, item D3a):
# `ConnectorValidator::new` logs its case-2 (undeclared-kind) report at
# `tracing::info!` so it is visible by default, not hidden behind `debug!`.
# Matches the outer workspace's pin (see the root Cargo.toml). Deliberately
# NOT `{ workspace = true }`, for the same reason as the pins above: this
# crate's manifest has to stand on its own even outside that workspace.
tracing = "0.1"
# Added by the form-schema digest (contreforts/contreforts-core#34, phase F
# item W4): `FormSchema` and its types are `Serialize` because W7 serves
# them verbatim rather than re-modelling them in a second wire struct -- so
# this type IS the wire contract, and deriving it here is what keeps the
# server from growing a parallel one that can drift. Deliberately NOT
# `{ workspace = true }`, for the same reason as every pin above: this
# crate's manifest has to stand on its own even outside the superproject it
# is nested inside today (see src/lib.rs).
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Test-only (contreforts/contreforts-core#34, phase F item W4). The digest's
# output types are `serde::Serialize` because W7 serialises them verbatim
# rather than re-modelling them in a second wire struct; the one thing this
# crate's own tests need on top of that is a serialiser to assert the result
# is deterministic and carries no prefill affordance
# (`sh:defaultValue` has zero triples tree-wide, so no default may reach the
# wire). Deliberately NOT `{ workspace = true }`, for the same reason as
# every pin above: this crate's manifest has to stand on its own even
# outside the superproject it is nested inside today (see src/lib.rs).
serde_json = "1"
